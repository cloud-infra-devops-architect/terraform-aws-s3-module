# pre-commit hooks for terraform-aws-s3-module
# Install once:   pip install pre-commit checkov && pre-commit install --install-hooks
# Run manually:   pre-commit run --all-files
# Requires locally: terraform, tflint, trivy, checkov (gitleaks is fetched by pre-commit).
# The same gates run server-side in .github/workflows/reusable-iac-ci.yml.

default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-added-large-files
      - id: detect-private-key
      - id: detect-aws-credentials
        args: ["--allow-missing-credentials"]
      - id: no-commit-to-branch
        args: ["--branch", "main", "--branch", "qa", "--branch", "dev"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.27.2
    hooks:
      - id: gitleaks
        args: ["--config", ".gitleaks.toml"]

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.99.4
    hooks:
      - id: terraform_fmt
        args:
          - --args=-recursive
      - id: terraform_validate
        args:
          - --tf-init-args=-backend=false
      - id: terraform_tflint
        args:
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl
      - id: terraform_trivy
        args:
          - --args=--config=__GIT_WORKING_DIR__/trivy.yaml
          - --args=--ignorefile=__GIT_WORKING_DIR__/.trivyignore
      - id: terraform_checkov
        args:
          - --args=--config-file __GIT_WORKING_DIR__/.checkov.yaml

  - repo: local
    hooks:
      - id: module-structure
        name: Module governance (README, examples, .amazonq rules, scanner configs)
        entry: scripts/check-module-structure.sh
        language: script
        pass_filenames: false
        always_run: true
